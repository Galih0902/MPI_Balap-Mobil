<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- SUARA: file mp3 pilihan guru (disimpan di IndexedDB); kosong = suara bawaan ---- */
const CS={},SL={bgm:'🎵 bgm.mp3 (musik latar)',maju:'🏎️ maju.mp3 (suara mobil melaju)',nitros:'⚡ nitros.mp3 (nitro menyala)',selip:'💥 selip.mp3 (mobil selip)',ledak:'💣 ledak.mp3 (kena TNT)',pecah:'📦 pecah.mp3 (kotak hancur oleh nitro)',benar:'✅ benar.mp3',salah:'❌ salah.mp3',tick:'⏱️ tick.mp3 (5 detik terakhir)',hitung:'3️⃣ hitung.mp3 (hitung mundur 3-2-1)',go:'🚦 go.mp3 (GO!)',lap:'🔄 lap.mp3 (lap baru)',finis:'🏁 finis.mp3 (lewat garis finis)',menang:'🏆 menang.mp3 (juara 1)'};let bgA=null,bgIv=null;

function defBgm(){if(bgIv)return;let i=0;const N=[523,659,784,659,587,698,880,698];bgIv=setInterval(()=>{if(S.bgm!==false&&!(G&&G.paused))beep(N[i++%8],.22,'triangle',.04)},340)}

function ctlMsg(m){if(!m||!m.t)return;C.lost=false;
if(m.t=='joined'){C.me={e:m.e,n:m.n};C.tok=m.tok;try{localStorage.setItem('bktok-'+JOIN,m.tok)}catch(e){}if(!['q','rev','cd','fin','end'].includes(C.st))C.st='lobby'}
else if(m.t=='err'){C.st='err';C.err=m.m;C.nore=true}
else if(m.t=='kick'){C.st='kick'}
else if(m.t=='cd'){C.st='cd';C.end=null}
else if(m.t=='q'){C.st='q';C.q=m;C.qn=m.qn;C.sel=null;C.lock=false;C.tm=m.tm||20;C.tlEnd=performance.now()+m.tl*1000}
else if(m.t=='rev'){C.st='rev';C.rv=m;try{navigator.vibrate&&navigator.vibrate(m.ok?60:[120,60,120])}catch(e){}}
else if(m.t=='fin'){C.st='fin';C.fin=m}
else if(m.t=='end'){C.st='end';C.end=m}
else if(m.t=='pause'){C.pz=m.on;if(!m.on&&C.q)C.tlEnd=performance.now()+(C.h.tl||0)*1000}
else if(m.t=='st'){C.h=m;C.hT=performance.now();if(C.st=='q'&&m.tl)C.tlEnd=performance.now()+m.tl*1000;ctlHud()}
ctlR()}
function ctlAns(k){if(C.st!='q'||C.lock||C.pz||!C.conn)return;C.lock=true;C.sel=k;try{C.conn.send({t:'ans',qn:C.qn,k})}catch(e){}ctlR()}
function ctlHud(){const h=C.h,s=(id,t)=>{const e=$(id);if(e&&e.textContent!==t)e.textContent=t};s('cpos',h.pos?MEDAL[h.pos-1]+' '+h.pos+'/'+h.n:'');s('clap',h.lap?'LAP '+h.lap+'/'+h.laps:'');s('cspd',h.spd!=null?h.spd+' km/h':'');s('cst',h.sl?'💥 SELIP':h.bt?'⚡ NITRO':h.bn||'')}
function ctlTick(){ctlMapDraw();if(C.st!='q'||C.pz)return;const left=Math.max(0,(C.tlEnd-performance.now())/1000),b=$('ctb'),t=$('ctt');if(b)b.style.width=Math.min(100,left/C.tm*100)+'%';if(t)t.textContent='⏱ '+Math.ceil(left)}
let mmB2=null;
function ctlMap(){return '<canvas id=cmm width=340 height=130></canvas>'}
function ctlMapDraw(){const c=$('cmm'),h=C.h;if(!c||!h||!h.all)return;const x=c.getContext('2d'),W=c.width,Hh=c.height;x.clearRect(0,0,W,Hh);
if(!mmB2){let a=1e9,b=-1e9,d=1e9,e=-1e9;PX.forEach((v,i)=>{a=Math.min(a,v);b=Math.max(b,v);d=Math.min(d,PZ[i]);e=Math.max(e,PZ[i])});mmB2={a,b,d,e,s:Math.min((W-24)/(b-a),(Hh-30)/(e-d))}}
const B=mmB2,X=v=>12+(v-B.a)*B.s+((W-24)-(B.b-B.a)*B.s)/2,Y=v=>18+(v-B.d)*B.s+((Hh-30)-(B.e-B.d)*B.s)/2;
x.lineWidth=7;x.strokeStyle='#22d3ee88';x.lineJoin='round';x.beginPath();for(let i=0;i<NS;i+=6){i?x.lineTo(X(PX[i]),Y(PZ[i])):x.moveTo(X(PX[i]),Y(PZ[i]))}x.closePath();x.stroke();x.fillStyle='#fff';x.fillRect(X(PX[0])-4,Y(PZ[0])-4,8,8);
const dt=C.pz?0:Math.min(1.5,(performance.now()-C.hT)/1000),pt=a=>{const sd=a[2]+a[3]*dt,j=Math.floor((Math.max(0,sd)%TL)/DS)%NS;return[X(PX[j]),Y(PZ[j])]};
h.all.forEach((a,k)=>{if(k===h.i)return;const[px,py]=pt(a);x.fillStyle=a[1];x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.arc(px,py,5,0,TAU);x.fill();x.stroke()});
const me=h.all[h.i];if(me){const[px,py]=pt(me);x.fillStyle=me[1];x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(px,py,9,0,TAU);x.fill();x.stroke();x.font='20px "Segoe UI Emoji","Apple Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='bottom';x.fillText('🏎️',px,py-8)}}
function ctlHdr(){const me=C.me||{e:'🙂',n:C.name};return `<div class=ch><b>${me.e} ${esc(me.n)}</b><span id=cpos></span><span id=clap></span><span id=cst></span></div>`}
function ctlView(){const me=C.me||{e:'🙂',n:C.name},q=C.q;
if(C.st=='name')return `<div class=cw><div style="font-size:3.6rem">🏎️</div><h2 style="margin:6px 0">Balap Kuis</h2><p>Kode ruangan: <b style="letter-spacing:.15em;font-size:1.4rem">${JOIN}</b></p><input id=cn maxlength=14 placeholder="Tulis namamu" value="${esc(C.name)}" style="width:100%;padding:14px;border-radius:14px;border:0;font:inherit;font-size:1.2rem;text-align:center"><button class="btn g big" style="margin-top:12px;width:100%" onclick=ctlJoin()>🚀 Gabung</button></div>`;
if(C.st=='conn')return `<div class=cw><div style="font-size:3rem;animation:bob 1.2s infinite">📡</div><h3>Menghubungkan ke ruangan ${JOIN}…</h3></div>`;
if(C.st=='err')return `<div class=cw><div style="font-size:3rem">⚠️</div><p>${esc(C.err||'Terjadi masalah')}</p>${C.nore?'':'<button class="btn g" onclick=ctlConnect()>🔄 Coba lagi</button>'}<button class=btn onclick="location.search=''">🏠 Keluar</button></div>`;
if(C.st=='kick')return `<div class=cw><div style="font-size:3rem">👋</div><p>Kamu dikeluarkan dari ruangan oleh guru.</p><button class=btn onclick="try{localStorage.removeItem('bktok-'+JOIN)}catch(e){}location.search=''">🏠 Keluar</button></div>`;
if(C.st=='lobby')return `<div class=cw><div style="font-size:5rem;animation:bob 2s infinite">${me.e}</div><h2>${esc(me.n)}</h2><p>✅ Terhubung! Menunggu guru memulai balapan…</p></div>`;
if(C.st=='cd')return `<div class=cw>${ctlHdr()}<div style="font-size:5rem;animation:bob 1s infinite">🏁</div><h2>Bersiap…</h2><p>Jawab cepat &amp; benar untuk menyalakan NITRO ⚡</p></div>`;
if(C.st=='fin'){const f=C.fin||{};return `<div class=cw>${ctlHdr()}${ctlMap()}<div style="font-size:4rem">🏁</div><h2>SELESAI! Juara ${f.rk}</h2><p>⭐ ${f.s} • ✅ ${f.corr} benar • ❌ ${f.wr} salah</p><p>Menunggu pemain lain…</p></div>`}
if(C.st=='end'){const r=C.end;return `<div class=cw><h2>🏆 Hasil Balapan</h2>${r.rank.map((p,k)=>`<div class="rk ${k==r.me?'w':''}"><span>${MEDAL[k]||k+1}</span><span class=av>${p.e}</span>${esc(p.n)}<em>⭐${p.s} ✅${p.corr}</em></div>`).join('')}<p>Menunggu guru memulai lagi…</p></div>`}
const rv=C.st=='rev'?C.rv:null;
return `${ctlHdr()}${ctlMap()}<div class=cq><div class=qb><i id=ctb style="width:${Math.min(100,Math.max(0,(C.tlEnd-performance.now())/1000)/C.tm*100)}%"></i></div><div class=qh><span id=ctt>⏱ ${Math.max(0,Math.ceil((C.tlEnd-performance.now())/1000))}</span><span class=fb>${rv?esc(rv.msg||''):C.lock?'Jawaban terkirim…':'&nbsp;'}</span></div>${q&&q.img?`<img class=qi src="${q.img}">`:''}<div class=qq>${esc(q?q.q:'')}</div>
<div class=co>${(q?q.o:[]).map((o,k)=>o?`<button class="qopt${rv?(k==rv.a?' ok':k==rv.sel?' no':' dim'):C.sel==k?' sel':''}" style="background:${COL[k]}" onpointerdown="ctlAns(${k})"><b>${L[k]}</b>${esc(o)}</button>`:'').join('')}</div></div>`}
function ctlR(){let h=ctlView();if(C.lost)h+=`<div class=ov><div class=md style="text-align:center"><h3>📡 Terputus…</h3><p>Menyambung ulang otomatis</p></div></div>`;else if(C.pz&&['q','rev'].includes(C.st))h+=`<div class=ov><div class=md style="text-align:center"><h3>⏸️ Dijeda guru</h3></div></div>`;
$('app').innerHTML=`<div class=cwrap>${h}</div>`;ctlHud()}

/* ---------- BANK SOAL ---------- */
function bank(){return `<div class=wrap><div class=top><button class=btn onclick="view='home';R()">⬅ Kembali</button><h2 style="margin:0">📚 Bank Soal (${S.qs.length})</h2></div>
<div class=row><button class="btn g" onclick="edit(-1)">➕ Tambah Soal</button><button class="btn b" onclick="M('imp')">📥 Import Massal</button><button class="btn r" onclick="if(confirm('Hapus semua soal?')){S.qs=[];save();R()}">🗑️ Hapus Semua</button></div>
${S.qs.map((q,i)=>`<div class=ql>${q.img?`<img src="${q.img}">`:`<span style="font-size:2rem">❓</span>`}<div class=t><b>${i+1}. ${esc(q.q)||'(soal gambar)'}</b><br><small>${q.o.map((o,k)=>k==q.a?`✅ ${L[k]}. ${esc(o)}`:`${L[k]}. ${esc(o)}`).join(' • ')}</small></div><button onclick="edit(${i})">✏️</button><button onclick="if(confirm('Hapus soal ini?')){S.qs.splice(${i},1);save();R()}">🗑️</button></div>`).join('')||'<p class=sub>Belum ada soal.</p>'}</div>`}
function edit(i){E=i<0?{i,q:'',o:['','','',''],a:0,img:''}:{i,...JSON.parse(JSON.stringify(S.qs[i]))};M('edit')}
function saveQ(){E.q=$('eq').value.trim();E.o=[0,1,2,3].map(k=>$('eo'+k).value.trim());E.a=+document.querySelector('input[name=ea]:checked').value;
if(!E.q&&!E.img)return toast('Isi pertanyaan atau gambar');if(E.o.filter(Boolean).length<2||!E.o[E.a])return toast('Minimal 2 pilihan & jawaban benar harus terisi');
const q={q:E.q,o:E.o,a:E.a,img:E.img};E.i<0?S.qs.push(q):S.qs[E.i]=q;save();closeM()}
const compress=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};im.src=fr.result};fr.readAsDataURL(f)});
async function pickImg(el){if(!el.files[0])return;E.img=await compress(el.files[0]);$('ep').innerHTML=`<img class=q-img style="max-height:120px" src="${E.img}">`}
async function bulkImg(el){for(const f of el.files)IM[f.name.toLowerCase()]=await compress(f);$('imc').textContent=Object.keys(IM).length+' gambar siap'}
function readTxt(el){const f=el.files[0];if(f){const r=new FileReader();r.onload=()=>$('it').value=r.result;r.readAsText(f)}}
function doImport(){const lines=$('it').value.split(/\r?\n/).filter(l=>l.trim());let ok=0,bad=0;
lines.forEach(l=>{const d=l.includes('|')?'|':l.includes('\t')?'\t':l.includes(';')?';':',',f=l.split(d).map(x=>x.trim());
if(/^pertanyaan|^soal/i.test(f[0]))return;let a=f[5]?f[5].toUpperCase():'';a=L.includes(a)&&a?L.indexOf(a):(+a>=1&&+a<=4?+a-1:-1);
const img=f[6]?IM[f[6].toLowerCase()]||'':'',o=f.slice(1,5);while(o.length<4)o.push('');
if(a<0||!o[a]||o.filter(Boolean).length<2||(!f[0]&&!img)){bad++;return}S.qs.push({q:f[0],o,a,img});ok++});
save();IM={};toast(`✅ ${ok} soal masuk${bad?`, ${bad} dilewati`:''}`);closeM()}

/* ---------- MODAL ---------- */
const stp=(lb,k,mn,mx,st)=>`<div class=stp><span>${lb}</span><div><button onclick="cf('${k}',${-st},${mn},${mx})">−</button><b>${S.cfg[k]}</b><button onclick="cf('${k}',${st},${mn},${mx})">+</button></div></div>`;
function cf(k,d,mn,mx){const o=S.cfg[k],n=Math.max(mn,Math.min(mx,o+d));S.cfg[k]=n;if(k=='l'&&G)G.ps.forEach(p=>{if(p.l>0)p.l=Math.max(1,p.l+n-o)});save();R()}
function M(m){stopTick();modal=m;if(G)G.paused=true;R()}
function closeM(){modal=(modal=='set'&&G&&view=='game')?'menu':null;if(!modal&&G)G.paused=false;R()}
function mod(){let h='';
if(modal=='set')h=`<h2>⚙️ Pengaturan</h2>${stp('⏱️ Waktu per soal (detik)','t',5,120,5)}${stp('🏁 Jumlah lap','lap',1,10,1)}${stp('⭐ Poin per jawaban benar','p',5,100,5)}${stp('⚡ Kekuatan nitro','n',1,5,1)}<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0"><span>⏱️ Bunyi tick hitung mundur</span><button class="btn ${S.tk===false?'':'g'}" style="width:auto;margin:0;padding:8px 14px" onclick=toggleTk()>${S.tk===false?'Mati':'Nyala'}</button></div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0"><span>🏎️ Suara mobil melaju (maju.mp3)</span><button class="btn ${S.eng===false?'':'g'}" style="width:auto;margin:0;padding:8px 14px" onclick=toggleEng()>${S.eng===false?'Mati':'Nyala'}</button></div><hr style="opacity:.3"><small>🎧 Pilih file mp3 hasil unduhan (tersimpan di perangkat ini). Kosong = suara bawaan.</small>${Object.keys(SL).map(k=>`<div class=stp><span>${SL[k]} ${CS[k]?'✅':'⚪'}</span><input type=file accept="audio/*" style="width:150px;font-size:.75rem" onchange="pickSnd('${k}',this)"></div>`).join('')}<button class="btn g" onclick=closeM()>✔ Selesai</button>`;
if(modal=='vol')h=`<h2>🔊 Volume Suara</h2><input type=range min=0 max=100 value="${Math.round((S.vol??1)*100)}" oninput="setVol(this.value)" style="width:100%;height:34px"><div id=vl style="text-align:center;font-size:1.6rem;font-weight:700">${Math.round((S.vol??1)*100)}%</div><button class="btn g" onclick=closeM()>✔ Selesai</button>`;
if(modal=='menu')h=`<h2>🎮 Menu Permainan</h2><button class="btn g" onclick="modal=null;G.paused=false;R()">▶️ Lanjutkan</button><button class="btn b" onclick="modal='set';R()">⚙️ Atur Waktu / Lap / Poin / Nitro</button><button class="btn r" onclick="finish()">🏁 Akhiri Balapan</button><button class=btn onclick="if(confirm('Keluar tanpa hasil?')){G=null;modal=null;view='home';bgStop();engOff();R()}">🚪 Keluar ke Beranda</button>`;
if(modal=='edit')h=`<h2>${E.i<0?'➕ Soal Baru':'✏️ Edit Soal'}</h2><input type=text id=eq placeholder="Pertanyaan" value="${esc(E.q)}">${E.o.map((o,k)=>`<div class=opr><input type=radio name=ea value=${k} ${E.a==k?'checked':''}><input type=text id=eo${k} placeholder="Pilihan ${L[k]}" value="${esc(o)}"></div>`).join('')}<small>⚪ Pilih bulatan di samping jawaban yang benar</small><br>🖼️ Gambar (opsional): <input type=file accept="image/*" onchange="pickImg(this)"><div id=ep>${E.img?`<img class=q-img style="max-height:120px" src="${E.img}">`:''}</div>${E.img?`<button class=btn onclick="E.img='';$('ep').innerHTML=''">Hapus gambar</button>`:''}<button class="btn g" onclick=saveQ()>💾 Simpan</button><button class=btn onclick=closeM()>Batal</button>`;
if(modal=='imp')h=`<h2>📥 Import Massal</h2><small>Satu soal per baris, pisahkan dengan <b>|</b> (atau tab/titik koma dari Excel):<br><code>Pertanyaan|A|B|C|D|Jawaban(A-D)|namafile.jpg (opsional)</code><br>Contoh: <code>2+3=?|4|5|6|7|B</code></small><div class=row style="margin:6px 0"><button class="btn o" style="width:auto" onclick=tpl()>📄 Template Soal</button><button class="btn b" style="width:auto" onclick=copyT()>📋 Salin</button></div><small>Baris judul otomatis dilewati. Klik Template untuk melihat contoh, salin ke Excel/Notepad lalu simpan sebagai .txt/.csv. Baris contoh bergambar hanya masuk jika gambarnya ikut diunggah.</small><textarea id=it placeholder="Tempel soal di sini…"></textarea>📄 Atau file .txt/.csv: <input type=file accept=".txt,.csv,.tsv" onchange="readTxt(this)"><br>🖼️ Gambar soal (boleh banyak, cocokkan lewat nama file di kolom ke-7): <input type=file accept="image/*" multiple onchange="bulkImg(this)"> <small id=imc></small><button class="btn g" onclick=doImport()>📥 Import</button><button class=btn onclick=closeM()>Batal</button>`;
return `<div class=ov><div class=md>${h}</div></div>`}

function R(){HC={};$('app').innerHTML=(view=='splash'?splash():view=='home'?home():view=='bank'?bank():gameV())+(modal?mod():'');if(RD)RD.domElement.style.display=view=='game'?'block':'none'}
if(JOIN)ctlInit();else{dbLoad();if(S.net)lbInit();R()}
</script></body></html>
